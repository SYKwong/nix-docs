name: Sync & Deploy Unified Docs

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [docs-updated]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync upstream documentation
        id: sync
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            bash scripts/sync-docs.sh --remote
            git add src/content/docs
            if ! git diff --cached --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "chore(docs): sync upstream documentation"
              git push origin HEAD:main
              echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            elif [ "${{ github.event_name }}" = "schedule" ]; then
              echo "No upstream documentation changes detected on schedule. Skipping build."
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            else
              echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.sync.outputs.should_deploy == 'true'
        with:
          node-version: "lts/*"
          cache: npm

      - name: Install dependencies
        if: steps.sync.outputs.should_deploy == 'true'
        run: npm ci --no-audit --no-fund

      - name: Build Starlight site
        if: steps.sync.outputs.should_deploy == 'true'
        run: npm run build

      - name: Deploy to Cloudflare Workers
        if: steps.sync.outputs.should_deploy == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
